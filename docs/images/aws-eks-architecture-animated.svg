<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">OpenTelemetry Astronomy Shop on AWS EKS</title>
<desc id="desc">Animated AWS architecture. User requests travel from browser through Route 53 and an internet-facing load balancer to the frontend proxy, Kubernetes Services, and microservices in private EKS subnets. Admin access follows a separate route through an EC2 bastion to the private EKS API. Terraform provisions the infrastructure, while GitHub Actions, an image registry, GitOps configuration, and Argo CD with Helm form the delivery workflow.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111F"/><stop offset=".56" stop-color="#0B192A"/><stop offset="1" stop-color="#07111F"/></linearGradient>
  <linearGradient id="headerLine"><stop stop-color="#44DFC7"/><stop offset=".5" stop-color="#6EBEFF"/><stop offset="1" stop-color="#C59BFF"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".22"/></filter>
  <marker id="trafficArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#44DFC7"/></marker>
  <marker id="adminArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#FFC16B"/></marker>
  <marker id="infraArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6EBEFF"/></marker>
  <marker id="gitopsArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C59BFF"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .heading{font-size:29px;font-weight:750;fill:#F3F7FF}
    .subtitle{font-size:15px;fill:#9DB2C8}
    .section{font-size:13px;font-weight:750;letter-spacing:1px}
    .node{fill:#13263A;stroke:#29445F;stroke-width:1.5;filter:url(#shadow)}
    .nodeGit{fill:#1B203A;stroke:#3B4167;stroke-width:1.5;filter:url(#shadow)}
    .nodeTitle{font-size:16px;font-weight:700;fill:#F3F7FF}
    .nodeSub{font-size:12.5px;fill:#9DB2C8}
    .flow{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 9;animation:dash 1.25s linear infinite}
    .traffic{stroke:#44DFC7;marker-end:url(#trafficArrow)}
    .admin{stroke:#FFC16B;marker-end:url(#adminArrow)}
    .infra{stroke:#6EBEFF;marker-end:url(#infraArrow)}
    .gitops{stroke:#C59BFF;marker-end:url(#gitopsArrow)}
    @keyframes dash{to{stroke-dashoffset:-42}}
    @-webkit-keyframes dash{to{stroke-dashoffset:-42}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}}
  </style>
</defs>
